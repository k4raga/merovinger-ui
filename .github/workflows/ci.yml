name: UI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and test tools
        run: python -m pip install . pytest==9.2.0 build
      - name: Run standalone tests
        run: python -m pytest -q tests --basetemp .runtime/pytest
      - name: Run context and PNG example
        run: python examples/ui_agent/main.py --smoke --report .runtime/smoke.json
      - name: Build wheel
        run: python -m build --wheel
